    <rect x="100" y="100" width="1080" height="400" fill="url(#grid)" opacity="0.3"/>

    <path d="M-50 50 H1300" stroke="#111" stroke-width="60"/>
    <path d="M-50 50 H1300" stroke="#333" stroke-width="40"/> <path d="M-50 80 H1300" stroke="#222" stroke-width="20"/>

