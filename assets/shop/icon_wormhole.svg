<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="40" stroke="#444" stroke-width="8" fill="none"/>
    <circle cx="50" cy="50" r="40" stroke="#000" stroke-width="2" stroke-dasharray="10 5" fill="none"/>
    
    <circle cx="50" cy="50" r="35" fill="black"/>
    
    <circle cx="50" cy="50" r="30" fill="url(#vortex_grad)">
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="40" cy="40" r="1" fill="white"/>
    <circle cx="60" cy="60" r="1" fill="white"/>
    <circle cx="55" cy="35" r="1.5" fill="white"/>
    
    <defs>
        <radialGradient id="vortex_grad" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="0.4" stop-color="#8000FF"/>
            <stop offset="0.8" stop-color="#200040"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
    </defs>
</svg>